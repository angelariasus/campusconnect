# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml - CampusConnect
# Universidad Innovatec
# Orquesta: Nginx + Node.js API + PostgreSQL + Redis (caché)
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── PostgreSQL: Base de datos relacional ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-campusconnect_db}
      POSTGRES_USER:     ${DB_USER:-campusconnect_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    ports:
      - "5432:5432"     # Exponer solo en desarrollo; comentar en producción
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campusconnect_user} -d ${DB_NAME:-campusconnect_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis: Caché y sesiones ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: campusconnect-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Backend: Node.js API ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: campusconnect-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV:    production
      PORT:        3000
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-campusconnect_db}
      DB_USER:     ${DB_USER:-campusconnect_user}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Nginx: Reverse Proxy + SSL ────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: campusconnect-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro      # Build del frontend
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    networks:
      - backend_net
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Certbot: Renovación automática de SSL (Let's Encrypt) ─────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: campusconnect-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

# ─── NETWORKS ────────────────────────────────────────────────────────────────
networks:
  backend_net:
    driver: bridge
    internal: false
  frontend_net:
    driver: bridge

# ─── VOLUMES ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local
  nginx_logs:
    driver: local
