# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/deploy.yml
# Pipeline CI/CD - CampusConnect
# Trigger: push a la rama main
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD - CampusConnect

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/campusconnect-backend

jobs:

  # ── JOB 1: Tests y Lint ────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campusconnect_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci

      - name: Ejecutar tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: campusconnect_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          JWT_SECRET: test_secret_key_para_ci_cd_pipeline
        run: npm test

  # ── JOB 2: Build de imagen Docker ─────────────────────────────────────────
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Setup BuildKit (caché)
        uses: docker/setup-buildx-action@v3

      - name: Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 3: Deploy a producción ─────────────────────────────────────────────
  deploy:
    name: Deploy Producción
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/campusconnect
            git pull origin main
            docker compose pull backend
            docker compose up -d --no-deps backend
            docker compose exec -T backend node scripts/seed.js || true
            docker image prune -f
            echo "Deploy completado: $(date)"

      - name: Verificar salud post-deploy
        run: |
          sleep 15
          curl -f https://campusconnect.innovatec.edu.pe/api/health || exit 1
          echo "API respondiendo correctamente"

      - name: Notificar resultado
        if: always()
        run: echo "Deploy ${{ job.status }} - Commit ${{ github.sha }}"
