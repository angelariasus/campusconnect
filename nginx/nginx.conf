# ─────────────────────────────────────────────────────────────────────────────
# nginx/nginx.conf - Reverse Proxy CampusConnect
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Optimizaciones de rendimiento ────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # ── Compresión gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ── Cabeceras de seguridad ───────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection "1; mode=block"       always;
    add_header Referrer-Policy "strict-origin"        always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ocultar versión de Nginx
    server_tokens off;

    # ── Upstream: Backend API ────────────────────────────────────────────────
    upstream campusconnect_api {
        least_conn;                     # Balanceo de carga
        server backend:3000;
        # Para escalabilidad horizontal, agregar más instancias:
        # server backend2:3000;
        # server backend3:3000;
        keepalive 32;
    }

    # ── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # ── Servidor HTTP → redirección HTTPS ───────────────────────────────────
    server {
        listen 80;
        server_name campusconnect.innovatec.edu.pe;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Servidor HTTPS principal ─────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name campusconnect.innovatec.edu.pe;

        # Certificados SSL (Let's Encrypt vía Certbot)
        ssl_certificate     /etc/letsencrypt/live/campusconnect.innovatec.edu.pe/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/campusconnect.innovatec.edu.pe/privkey.pem;

        # Configuración SSL moderna
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # ── Proxy hacia la API ────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://campusconnect_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Rate limiting más estricto para login
        location /api/auth/login {
            limit_req zone=login burst=5;
            proxy_pass http://campusconnect_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Archivos estáticos / Frontend ─────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # ── Health check sin logs ─────────────────────────────────────────
        location /api/health {
            access_log off;
            proxy_pass http://campusconnect_api;
        }
    }
}
